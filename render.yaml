# Blueprint de Render: backend como Web Service y frontend como Static Site.
# Los valores secretos (sync: false) se cargan a mano en el dashboard de Render, nunca en el repo.
# Si Render asigna otra URL (por ejemplo con sufijo), actualizar BETTER_AUTH_URL, FRONTEND_URL y el rewrite de /api.
services:
  - type: web
    name: recetario-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://recetario.onrender.com
      - key: FRONTEND_URL
        value: https://recetario.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: web
    name: recetario
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # El frontend llama a /api y Render lo reenvia al backend (misma URL -> cookies first-party).
      - type: rewrite
        source: /api/*
        destination: https://recetario-api.onrender.com/api/*
      # F5 en cualquier ruta del SPA devuelve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
